<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/logo/xinrm-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XINRM | Xavier Institute of Natural Resource Management - Sustainable Rural Development</title>
    <meta name="description" content="Xavier Institute of Natural Resource Management (XINRM) offers specialized education in sustainability, combining 50 years of action research with academic excellence. Join us for a future in sustainable development." />
    <meta name="keywords" content="XINRM, Natural Resource Management, Sustainability, Rural Development, Xavier Institute, MA NRM, Watershed Management, Maharashtra, India" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <!-- Hidden form for Netlify Forms detection -->
    <form name="admission" data-netlify="true" hidden>
      <input type="text" name="name" />
      <input type="text" name="surname" />
      <input type="text" name="fatherName" />
      <input type="text" name="motherName" />
      <input type="date" name="dob" />
      <input type="text" name="sex" />
      <input type="text" name="maritalStatus" />
      <input type="text" name="nationality" />
      <input type="email" name="email" />
      <input type="tel" name="contactNumber" />
      <input type="text" name="aadharNo" />
      <input type="text" name="abcId" />
      <input type="text" name="category" />
      <input type="text" name="hostelRequired" />
      <textarea name="presentAddress"></textarea>
      <textarea name="qualifications"></textarea>
      <textarea name="languages"></textarea>
      <input type="text" name="isEmployed" />
      <textarea name="employmentDetails"></textarea>
      <textarea name="hobbies"></textarea>
      <textarea name="extracurriculars"></textarea>
      <input type="text" name="sourceOfInfo" />
      <textarea name="statementOfIntent"></textarea>
      <textarea name="careerIntent"></textarea>
      <input type="date" name="date" />
      <input type="text" name="place" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
